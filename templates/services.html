<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ct168 &mdash; Services</title>
<link rel="stylesheet" href="/static/style.css">
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { background:var(--bg);color:var(--text);font-family:monospace;font-size:13px;min-height:100vh; }
#topbar { display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-dim);background:var(--panel);margin-bottom:16px; }
#topbar h1 { font-size:13px;color:var(--heading);letter-spacing:3px;text-transform:uppercase; }
#tick { font-size:10px;color:var(--dim);margin-left:auto; }
.section { max-width:820px;margin:0 auto 24px;padding:0 14px; }
.section-title { font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-dim); }
.section-note { font-size:10px;color:var(--dim);margin-bottom:10px; }

/* ── Service rows ─────────────────────────────────────────── */
.svc-row {
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 12px;margin-bottom:6px;
    background:var(--panel);border:1px solid var(--border-dim);border-radius:4px;
}
.svc-label { flex:1;font-size:12px;color:var(--text);min-width:170px; }
.svc-port { font-size:10px;color:var(--dim);min-width:70px; }
.svc-btns { display:flex;gap:6px;min-width:250px; }
.btn-start, .btn-stop, .btn-restart {
    padding:4px 12px;border-radius:3px;font-family:monospace;font-size:11px;
    letter-spacing:1px;cursor:pointer;transition:background 0.15s,border-color 0.15s;
    flex-shrink:0;
}
.btn-start { border:1px solid #2a6a2a;background:#0a1a0a;color:#66ee66; }
.btn-start:hover { background:#0f2a0f;border-color:#44cc44;color:#88ff88; }
.btn-stop { border:1px solid #6a2a2a;background:#1a0a0a;color:#ee6666; }
.btn-stop:hover { background:#2a0f0f;border-color:#cc4444;color:#ff8888; }
.btn-restart { border:1px solid #664400;background:#1a1000;color:#ddaa44; }
.btn-restart:hover { background:#2a1800;border-color:#eeaa22;color:#ffcc66; }
.btn-start:disabled, .btn-stop:disabled, .btn-restart:disabled { opacity:0.3;cursor:default; }
.protected { font-size:10px;color:var(--dim);align-self:center; }

/* ── Status indicator ─────────────────────────────────────── */
.svc-status { display:flex;align-items:center;gap:6px;min-width:110px;flex-shrink:0; }
.dot { width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor; }
.dot-active   { background:#44ee44;color:#44ee44; }
.dot-inactive { background:#444466;color:#444466;box-shadow:none; }
.dot-failed   { background:#ee4444;color:#ee4444; }
.dot-unknown  { background:#cccc00;color:#cccc00; }
.status-text { font-size:10px;letter-spacing:1px;text-transform:uppercase; }
.status-active   { color:#44ee44; }
.status-inactive { color:#8888aa; }
.status-failed   { color:#ee4444; }
.status-unknown  { color:#cccc00; }
</style>
</head>
<body>
<div id="topbar">
    <h1>&#9881; ct168 Services</h1>
    <span id="tick"></span>
</div>

<div class="section">
    <div class="section-title">System Services</div>
    <div class="section-note">STOP also disables the service, so it stays off after a reboot until STARTed again. Stopping rnsd also stops MeshChat.</div>
    <div id="svc-list">
        <div style="color:var(--dim);font-size:11px;padding:12px">Loading&hellip;</div>
    </div>
</div>

<script>
'use strict';

var BASE = 'http://' + location.hostname + ':8098';

function statusKind(status) {
    if (status === 'active' || status === 'failed' || status === 'inactive') return status;
    return 'unknown';
}

var LABELS = { start: '&#9654; Start', stop: '&#9646;&#9646; Stop', restart: '&#8635; Restart' };

function svcRowHTML(svc) {
    var btns = svc.actions.length
        ? svc.actions.map(function(a) {
              return '<button class="btn-' + a + '" data-action="' + a + '" onclick="svcAction(\'' +
                     svc.name + '\',\'' + a + '\')">' + LABELS[a] + '</button>';
          }).join('')
        : '<span class="protected">protected</span>';
    var k = statusKind(svc.status);
    return '<span class="svc-label">' + svc.label + '</span>' +
        '<span class="svc-port">' + (svc.port ? 'port ' + svc.port : '&mdash;') + '</span>' +
        '<div class="svc-btns">' + btns + '</div>' +
        '<div class="svc-status">' +
            '<div class="dot dot-' + k + '"></div>' +
            '<span class="status-text status-' + k + '">' + svc.status + '</span>' +
        '</div>';
}

function setButtons(row, status) {
    row.querySelectorAll('button[data-action]').forEach(function(b) {
        var a = b.getAttribute('data-action');
        if (a === 'start') b.disabled = (status === 'active');
        if (a === 'stop')  b.disabled = (status !== 'active');
    });
}

function renderServices(svcs) {
    var list = document.getElementById('svc-list');
    list.innerHTML = '';
    svcs.forEach(function(svc) {
        var row = document.createElement('div');
        row.className = 'svc-row';
        row.id = 'svc-row-' + svc.name;
        row.innerHTML = svcRowHTML(svc);
        setButtons(row, svc.status);
        list.appendChild(row);
    });
}

function updateServiceRow(name, status) {
    var row = document.getElementById('svc-row-' + name);
    if (!row) return;
    var k = statusKind(status);
    var dot  = row.querySelector('.dot');
    var text = row.querySelector('.status-text');
    if (dot)  dot.className = 'dot dot-' + k;
    if (text) { text.className = 'status-text status-' + k; text.textContent = status; }
    setButtons(row, status);
}

function svcAction(name, action) {
    var row = document.getElementById('svc-row-' + name);
    if (row) updateServiceRow(name, action === 'stop' ? 'deactivating' : 'activating');
    fetch(BASE + '/api/service/' + name + '/' + action, {method:'POST'})
        .then(function(r){ return r.json(); })
        .then(function(d){
            if (!d.ok) alert('Error: ' + d.message);
            setTimeout(loadServices, 800);
        })
        .catch(function(e){ alert('Request failed: ' + e); });
}

var _svcsLoaded = false;
function loadServices() {
    fetch(BASE + '/api/services').then(function(r){ return r.json(); }).then(function(svcs){
        if (!_svcsLoaded) { renderServices(svcs); _svcsLoaded = true; }
        else svcs.forEach(function(svc){ updateServiceRow(svc.name, svc.status); });
    }).catch(function(){});
}

var cd = 5;
setInterval(function(){
    cd--;
    document.getElementById('tick').textContent = 'refresh in ' + cd + 's';
    if (cd <= 0) { cd = 5; loadServices(); }
}, 1000);

loadServices();
</script>
<script src="/static/textsize.js"></script>
</body>
</html>
